name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q bin test_data
      - name: Nextflow config/lint
        run: |
          nextflow config .
          nextflow lint .
      - name: Test profile parameters
        run: nextflow config . -profile test,docker

  smoke:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest'
      - uses: docker/setup-buildx-action@v3
      - name: Build lightweight test containers
        run: ./docker/build_images.sh
      - name: Run end-to-end smoke test
        run: nextflow run . -profile test,docker -resume
      - name: Assert expected outputs
        run: |
          test -s results_test/01_genomics/candidates/candidate_loci.tsv
          test -s results_test/01_genomics/association/association_results.tsv
          test -s results_test/02_annotation/variant_annotation.tsv
          test -s results_test/02_annotation/protein_sequences.fasta
          test -s results_test/03_structure/structure_manifest.tsv
          test -s results_test/04_cheminformatics/molecular_descriptors.tsv
          test -s results_test/05_dti/affinity_matrix.tsv
          test -s results_test/06_results/top_predicted_candidates.tsv
